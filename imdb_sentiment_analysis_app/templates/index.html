<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sentiment AI</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    #dbeafe 0%,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #e0e7ff 0%,
                    transparent 35%
                ),
                #f8fafc;

            color: #0f172a;
        }

        /* Main card */

        .container {
            width: 100%;
            max-width: 720px;

            background: rgba(255, 255, 255, 0.9);

            border: 1px solid rgba(255, 255, 255, 0.8);

            border-radius: 24px;

            padding: 45px;

            box-shadow:
                0 25px 60px rgba(15, 23, 42, 0.12),
                0 5px 15px rgba(15, 23, 42, 0.05);

            backdrop-filter: blur(12px);
        }

        /* Header */

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo {
            width: 64px;
            height: 64px;

            margin: 0 auto 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 18px;

            font-size: 30px;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed
                );

            color: white;

            box-shadow:
                0 10px 25px rgba(79, 70, 229, 0.3);
        }

        h1 {
            font-size: 34px;
            font-weight: 750;

            letter-spacing: -1px;

            margin-bottom: 10px;
        }

        .description {
            color: #64748b;

            font-size: 16px;

            line-height: 1.6;
        }

        /* Form */

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 10px;

            font-size: 14px;

            font-weight: 600;

            color: #334155;
        }

        textarea {
            width: 100%;
            min-height: 190px;

            padding: 18px;

            resize: vertical;

            border: 2px solid #e2e8f0;

            border-radius: 16px;

            background: #f8fafc;

            color: #0f172a;

            font-family: inherit;

            font-size: 16px;

            line-height: 1.6;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        textarea::placeholder {
            color: #94a3b8;
        }

        textarea:hover {
            border-color: #cbd5e1;
        }

        textarea:focus {
            outline: none;

            background: white;

            border-color: #6366f1;

            box-shadow:
                0 0 0 4px rgba(99, 102, 241, 0.12);
        }

        /* Button */

        button {
            width: 100%;

            padding: 16px 20px;

            border: none;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed
                );

            color: white;

            font-family: inherit;

            font-size: 16px;

            font-weight: 650;

            cursor: pointer;

            box-shadow:
                0 10px 20px rgba(79, 70, 229, 0.22);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 14px 25px rgba(79, 70, 229, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .button-icon {
            margin-right: 8px;
        }

        /* Result */

        .result {
            margin-top: 32px;

            padding: 28px;

            border-radius: 18px;

            background: #f8fafc;

            border: 1px solid #e2e8f0;

            text-align: center;

            animation: fadeIn 0.4s ease;
        }

        .result-title {
            margin-bottom: 15px;

            font-size: 13px;

            font-weight: 600;

            text-transform: uppercase;

            letter-spacing: 1px;

            color: #64748b;
        }

        .sentiment {
            display: inline-block;

            padding: 9px 20px;

            border-radius: 999px;

            font-size: 24px;

            font-weight: 750;

            text-transform: uppercase;

            letter-spacing: 0.5px;

            {% if sentiment == "positive" %}
                background: #dcfce7;
                color: #15803d;
            {% else %}
                background: #fee2e2;
                color: #dc2626;
            {% endif %}
        }

        .confidence {
            margin-top: 18px;

            font-size: 15px;

            color: #64748b;
        }

        .confidence strong {
            color: #0f172a;
        }

        /* Confidence bar */

        .progress-container {
            width: 100%;

            height: 9px;

            margin-top: 14px;

            overflow: hidden;

            border-radius: 999px;

            background: #e2e8f0;
        }

        .progress-bar {
            height: 100%;

            width: {{ confidence * 100 }}%;

            border-radius: inherit;

            {% if sentiment == "positive" %}
                background: #22c55e;
            {% else %}
                background: #ef4444;
            {% endif %}

            transition: width 0.7s ease;
        }

        /* Footer */

        .footer {
            margin-top: 25px;

            text-align: center;

            color: #94a3b8;

            font-size: 13px;
        }

        .footer span {
            color: #6366f1;
            font-weight: 600;
        }

        /* Animation */

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* Responsive */

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .container {
                padding: 30px 22px;
                border-radius: 20px;
            }

            h1 {
                font-size: 28px;
            }

            .logo {
                width: 56px;
                height: 56px;
            }

            textarea {
                min-height: 160px;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <div class="header">

        <div class="logo">
            ✦
        </div>

        <h1>Sentiment AI</h1>

        <p class="description">
            Analyze the sentiment of a movie review using
            your trained LSTM neural network.
        </p>

    </div>


    <form method="POST">

        <div class="form-group">

            <label for="review">
                Your Review
            </label>

            <textarea
                id="review"
                name="review"
                placeholder="Write your movie review here..."
                required
            >{{ review }}</textarea>

        </div>


        <button type="submit">

            <span class="button-icon">✦</span>

            Analyze Sentiment

        </button>

    </form>


    {% if sentiment %}

    <div class="result">

        <div class="result-title">
            Prediction
        </div>

        <div class="sentiment">
            {{ sentiment }}
        </div>

        <div class="confidence">

            Confidence:
            <strong>
                {{ "%.2f"|format(confidence * 100) }}%
            </strong>

        </div>

        <div class="progress-container">

            <div class="progress-bar"></div>

        </div>

    </div>

    {% endif %}


    <div class="footer">

        Powered by
        <span>PyTorch LSTM</span>

    </div>

</div>

</body>

</html>
